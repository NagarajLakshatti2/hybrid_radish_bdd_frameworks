[project]
name = "quality-platform"
version = "1.0.0"
description = "Quality Engineering Platform CLI"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.9.0",
  "pyyaml",
  "scikit-learn",
  "joblib"
]

[project.scripts]
quality = "quality_cli.cli:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# 🔒 THIS IS THE IMPORTANT PART
[tool.setuptools]
packages = ["quality_cli"]
