# 1️⃣ Workflow name
name: Quality Platform CI


# 2️⃣ Workflow triggers
on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

  workflow_dispatch:

  schedule:
    - cron: "0 2 * * 1-5"   # nightly
    - cron: "0 3 * * 0"     # weekly

permissions:
  contents: write

jobs:
  # 3️⃣ Quality test execution job
  quality-tests:
    runs-on: ${{ matrix.runner }}

    # 4️⃣ Test matrix definition
    strategy:
      matrix:
        include:
          - suite: web
            runner: ubuntu-latest

          - suite: api
            runner: ubuntu-latest

          - suite: mobile
            runner: ubuntu-latest

    # 5️⃣ Global environment configuration
    env:
      ENV: qa
      HEADLESS: true
      ENABLE_MOBILE: false
      RADISH_TAGS: "@smoke and not @flaky"

      WEB_BASE_URL: https://rahulshettyacademy.com/loginpagePractise/
      WEB_USERNAME: rahulshettyacademy
      WEB_PASSWORD: ${{ secrets.WEB_PASSWORD }}

    # 6️⃣ Job steps
    steps:
      # 6.1️⃣ Checkout source code
      - uses: actions/checkout@v4

      # 6.2️⃣ Setup Python runtime
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 6.3️⃣ Cache pip dependencies
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      # 6.4️⃣ Install dependencies and CLI
      - name: Install deps + CLI
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 6.5️⃣ Prepare report directories
      - name: Prepare dirs
        run: |
          mkdir -p reports allure-results

      - name: Skip mobile if no tests
        if: matrix.suite == 'mobile' && hashFiles('features/mobile/**') == ''
        run: |
          echo "🚫 No mobile tests yet. Skipping."
          exit 0
      

      # 6.7️⃣ Skip mobile suite if not implemented
      - name: Skip mobile suite if not implemented
        if: matrix.suite == 'mobile'
        run: |
          if [ ! -d "features/mobile" ] || [ -z "$(ls -A features/mobile)" ]; then
            echo "🚫 No mobile tests found. Skipping."
            exit 0
          fi

      - name: Skip mobile unless enabled
        if: matrix.suite == 'mobile' && github.event.inputs.run_mobile != 'true'
        run: |
          echo "🚫 Mobile disabled via workflow input"
          exit 0

      # 6.8️⃣ Execute quality test suite
      - name: Quality run (${{ matrix.suite }})
        if: matrix.suite != 'mobile' || runner.os == 'self-latest'
        run: |
          radish features/${{ matrix.suite }} --tags "${{ env.RADISH_TAGS }}" || true

      # 6.9️⃣ Quality gate enforcement
      - name: Quality gate
        run: quality gate

      - name: Generate leadership summary
        run: |
          echo "Suite execution summary" > leadership_report.txt
          echo "Run ID: ${{ github.run_id }}" >> leadership_report.txt
          echo "Branch: ${{ github.ref_name }}" >> leadership_report.txt
          echo "Triggered by: ${{ github.actor }}" >> leadership_report.txt
      

      # 6.🔟 Upload JUnit results
      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.suite }}
          path: reports/junit-${{ matrix.suite }}.xml

      # 6.1️⃣1️⃣ Slack notification on failure
      - name: Slack notify (failure)
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\":\"❌ Quality failure • ${{ matrix.suite }} • Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
          ${{ secrets.SLACK_WEBHOOK }}

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.suite }}
          path: allure-results

  # 7️⃣ Reporting and publishing job
  quality-report:
    needs: quality-tests
    runs-on: ubuntu-latest

    steps:
      # 7.1️⃣ Checkout source
      - uses: actions/checkout@v4

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          path: allure-results

      - name: Merge Allure results
        run: |
          mkdir merged-results
          find allure-results -type f -exec cp {} merged-results \;

      # 7.2️⃣ Download test artifacts
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # 7.3️⃣ Install Allure CLI
      - name: Install Allure
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre
          curl -fL -o allure.tgz https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          file allure.tgz
          tar -xzf allure.tgz
          sudo mv allure-2.27.0 /opt/allure
          sudo ln -sf /opt/allure/bin/allure /usr/bin/allure
          allure --version
      


      - name: Restore Allure history
        run: |
          if [ -d ".git" ]; then rm -rf .git; fi
          git clone --branch gh-pages https://github.com/${{ github.repository }}.git gh-pages || true

          if [ -d "gh-pages/history" ]; then
            echo "✅ Restoring Allure history"
            mkdir -p merged-results/history
            cp -r gh-pages/history/* merged-results/history/
          else
            echo "ℹ️ No previous history found"
          fi

      # 7.4️⃣ Generate platform reports and
      - name: Generate Allure report
        run: |
          allure generate allure-results --clean -o allure-report
          

      # 7.5️⃣ Upload Allure report
      - uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report

      # 7.6️⃣ Upload leadership report
      - uses: actions/upload-artifact@v4
        with:
          name: leadership-report
          path: quality/leadership_report.txt

      # 7.7️⃣ Deploy Allure report (main branch only)
      - name: Deploy Allure (main only)
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report

      # 7.9️⃣ Print Allure report URL
      - name: Print Allure URL
        if: github.ref == 'refs/heads/main'
        run: |
          echo "📊 Allure Report:"
          echo "https://NagarajLakshatti2.github.io/hybrid_radish_bdd_frameworks/"

      # 7.8️⃣ Slack success notification
      - name: Slack summary (success)
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"✅ Quality passed • Allure: https://NagarajLakshatti2.github.io/hybrid_radish_bdd_frameworks/\"}" \
            ${{ secrets.SLACK_WEBHOOK }}