name: Radish BDD Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  radish-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Radish BDD tests
        run: |
          mkdir -p reports
          radish features/web --junit-xml=reports/junit.xml

      # ✅ Upload JUnit XML (for trends & dashboards)
      - name: Upload JUnit results
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: reports/junit.xml

      # ✅ Upload screenshots (failure evidence)
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: reports/screenshots

      # ✅ Native GitHub test summary (TREND ENABLED)
      - name: Publish Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Radish BDD Report
          path: reports/junit.xml
          reporter: java-junit
