name: Cucumber Report (Radish BDD)

on:
  push:
    branches: [ cucumberReport ]
  workflow_dispatch:

permissions:
  contents: write   # required to push to gh-pages

jobs:
  radish-tests:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}

      WEB_BASE_URL: https://rahulshettyacademy.com/loginpagePractise/
      WEB_USERNAME: rahulshettyacademy
      WEB_PASSWORD: ${{ secrets.WEB_PASSWORD }}

      RADISH_TAGS: "@smoke and not @flaky"

    steps:
      # 1️⃣ Checkout source code (cucumberReport branch)
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4️⃣ Run Radish BDD and generate cucumber.json
      - name: Run Radish BDD
        run: |
          mkdir -p reports
          radish features/web \
            --tags "${RADISH_TAGS}" \
            --cucumber-json=reports/cucumber.json

      # 5️⃣ Prepare GitHub Pages content
      - name: Prepare Pages content
        run: |
          mkdir site
          cp reports/cucumber.json site/

          cat <<EOF > site/index.html
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <title>Cucumber Report</title>
          </head>
          <body>
            <h2>Quality Platform – Cucumber Report</h2>
            <p>
              <a href="cucumber.json">Download cucumber.json</a>
            </p>
            <p>This file is compatible with Jenkins Cucumber Reports plugin.</p>
          </body>
          </html>
          EOF

      # 6️⃣ Deploy to gh-pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site
