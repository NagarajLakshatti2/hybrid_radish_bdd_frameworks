name: Radish BDD – Cucumber Report

on:
  push:
    branches: [ cucumberReport, main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  radish-tests:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}

      WEB_BASE_URL: https://rahulshettyacademy.com/loginpagePractise/
      WEB_USERNAME: rahulshettyacademy
      WEB_PASSWORD: ${{ secrets.WEB_PASSWORD }}

      RADISH_TAGS: smoke
      HEADLESS: true

    steps:
      # 1️⃣ Checkout
      - uses: actions/checkout@v4

      # 2️⃣ Python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3️⃣ Install Python deps
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4️⃣ Run Radish (SOURCE OF TRUTH)
      - name: Run Radish BDD
        run: |
          mkdir -p reports
          radish features/web \
            --tags "${RADISH_TAGS}" \
            --cucumber-json=reports/cucumber.json

      # 5️⃣ Generate Cucumber HTML (Node-based, reliable)
      - name: Generate Cucumber HTML
        run: |
          mkdir -p reports/html
          npm install cucumber-html-reporter
          node cucumber-html.config.js
      

      # 6️⃣ Upload artifacts
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: |
            reports/cucumber.json
            reports/html

      # 7️⃣ Deploy to GitHub Pages
      - name: Deploy Cucumber Report
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: reports/html
