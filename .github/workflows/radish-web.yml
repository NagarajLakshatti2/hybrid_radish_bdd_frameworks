name: Quality Platform CI

on:
  push:
    branches: [ main, cucumberReport ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1-5"
    - cron: "0 3 * * 0"

jobs:
  quality-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        suite: [ web ]

    env:
      PYTHONPATH: ${{ github.workspace }}

      WEB_BASE_URL: https://rahulshettyacademy.com/loginpagePractise/
      WEB_USERNAME: rahulshettyacademy
      WEB_PASSWORD: ${{ secrets.WEB_PASSWORD }}

      RADISH_TAGS: "@smoke and not @flaky"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare report directory
        run: |
          mkdir -p reports

      - name: Run Radish BDD (${{ matrix.suite }})
        run: |
          radish features/${{ matrix.suite }} \
            --tags "${RADISH_TAGS}" \
            --cucumber-json=reports/cucumber-${{ matrix.suite }}.json

      - name: Upload Cucumber JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-${{ matrix.suite }}
          path: reports/cucumber-${{ matrix.suite }}.json
