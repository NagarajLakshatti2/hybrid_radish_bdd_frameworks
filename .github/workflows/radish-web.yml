# 1️⃣ Workflow name
name: Quality Platform CI

# 2️⃣ Workflow triggers
on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

  workflow_dispatch:

  schedule:
    - cron: "0 2 * * 1-5"   # nightly
    - cron: "0 3 * * 0"     # weekly

permissions:
  contents: write

# ===========================
# 3️⃣ QUALITY TEST EXECUTION
# ===========================
jobs:
  quality-tests:
    runs-on: ${{ matrix.runner }}

    strategy:
      matrix:
        include:
          - suite: web
            runner: ubuntu-latest
          - suite: api
            runner: ubuntu-latest
          - suite: mobile
            runner: ubuntu-latest

    # 4️⃣ Global environment
    env:
      ENV: qa
      HEADLESS: true
      RADISH_TAGS: "@smoke and not @flaky"

      WEB_BASE_URL: https://rahulshettyacademy.com/loginpagePractise/
      WEB_USERNAME: rahulshettyacademy
      WEB_PASSWORD: ${{ secrets.WEB_PASSWORD }}

    steps:
      # 5️⃣ Checkout code
      - uses: actions/checkout@v4

      # 6️⃣ Setup Python (LOCKED)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 7️⃣ Cache pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      # 8️⃣ Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 9️⃣ Prepare report folder
      - name: Prepare reports directory
        run: |
          mkdir -p reports

      # 🔟 Skip mobile if not implemented
      - name: Skip mobile suite if empty
        if: matrix.suite == 'mobile'
        run: |
          if [ ! -d "features/mobile" ] || [ -z "$(ls -A features/mobile)" ]; then
            echo "🚫 No mobile tests found. Skipping."
            exit 0
          fi

      # 1️⃣1️⃣ Execute Radish (DEFAULT CLI)
      - name: Run Radish (${{ matrix.suite }})
        run: |
          radish features/${{ matrix.suite }} \
            --tags "${{ env.RADISH_TAGS }}" \
            --junit-xml=reports/junit-${{ matrix.suite }}.xml

      # 1️⃣2️⃣ Upload JUnit result
      - name: Upload JUnit result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.suite }}
          path: reports/junit-${{ matrix.suite }}.xml

      # 1️⃣3️⃣ Slack notify on failure
      - name: Slack notify (failure)
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\":\"❌ Quality failure • ${{ matrix.suite }} • Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
          ${{ secrets.SLACK_WEBHOOK }}

# ===========================
# 4️⃣ REPORTING & PUBLISHING
# ===========================
  quality-report:
    needs: quality-tests
    runs-on: ubuntu-latest

    steps:
      # 1️⃣4️⃣ Checkout code
      - uses: actions/checkout@v4

      # 1️⃣5️⃣ Download all JUnit artifacts
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # 1️⃣6️⃣ Collect JUnit files
      - name: Collect JUnit reports
        run: |
          mkdir reports
          find artifacts -name "*.xml" -exec cp {} reports \;

      # 1️⃣7️⃣ Install Allure CLI
      - name: Install Allure CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre
          curl -fL -o allure.tgz https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -xzf allure.tgz
          sudo mv allure-2.27.0 /opt/allure
          sudo ln -sf /opt/allure/bin/allure /usr/bin/allure
          allure --version

      # 1️⃣8️⃣ Generate Allure report (JUnit based)
      - name: Generate Allure report
        run: |
          allure generate reports --clean -o allure-report

      # 1️⃣9️⃣ Upload Allure report artifact
      - uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report

      # 2️⃣0️⃣ Deploy Allure report to GitHub Pages
      - name: Deploy Allure (main only)
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report

      # 2️⃣1️⃣ Print Allure URL
      - name: Print Allure URL
        if: success()
        run: |
          echo "📊 Allure Report:"
          echo "https://NagarajLakshatti2.github.io/hybrid_radish_bdd_frameworks/"

      # 2️⃣2️⃣ Slack notify success
      - name: Slack notify (success)
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\":\"✅ Quality passed • Allure: https://NagarajLakshatti2.github.io/hybrid_radish_bdd_frameworks/\"}" \
          ${{ secrets.SLACK_WEBHOOK }}
