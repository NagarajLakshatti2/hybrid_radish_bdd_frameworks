name: Radish BDD – Cucumber Report

on:
  push:
    branches: [ cucumberReport, main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# REQUIRED for GitHub Pages
permissions:
  contents: write

jobs:
  radish-tests:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}

      WEB_BASE_URL: https://rahulshettyacademy.com/loginpagePractise/
      WEB_USERNAME: rahulshettyacademy
      WEB_PASSWORD: ${{ secrets.WEB_PASSWORD }}

      RADISH_TAGS: smoke
      HEADLESS: true

    steps:
      # 1️⃣ Checkout source
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cucumber-html-report

      # 4️⃣ Run Radish BDD
      - name: Run Radish BDD
        run: |
          mkdir -p reports
          radish features/web \
            --tags "${RADISH_TAGS}" \
            --cucumber-json=reports/cucumber.json

      # 5️⃣ Generate Cucumber HTML
      - name: Generate Cucumber HTML
        run: |
          mkdir -p reports/html
          cucumber-html-report \
            --json reports/cucumber.json \
            --output reports/html

