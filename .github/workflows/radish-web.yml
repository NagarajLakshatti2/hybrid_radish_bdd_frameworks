name: Radish BDD – Cucumber Report

on:
  push:
    branches: [ main, cucumberReport ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  radish-tests:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}
      WEB_BASE_URL: https://rahulshettyacademy.com/loginpagePractise/
      WEB_USERNAME: rahulshettyacademy
      WEB_PASSWORD: ${{ secrets.WEB_PASSWORD }}
      RADISH_TAGS: smoke
      HEADLESS: true

    steps:
      # 1️⃣ Checkout
      - uses: actions/checkout@v4

      # 2️⃣ Python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3️⃣ Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4️⃣ Run Radish (never stop pipeline)
      - name: Run Radish BDD
        run: |
          mkdir -p reports
          radish features/web \
            --tags "${RADISH_TAGS}" \
            --cucumber-json=reports/cucumber.json || true

      # 🔥 4.5️⃣ Inject screenshots + logs into cucumber.json
      - name: Inject attachments into cucumber.json
        if: always()
        run: |
          python inject_attachments.py

      # 5️⃣ Generate Cucumber HTML (YOUR config file)
      - name: Generate Cucumber HTML
        if: always()
        run: |
          npm install cucumber-html-reporter
          node cucumber-html.config.js
          node cucumber-html.config.js

      # 6️⃣ Upload artifacts (for download)
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: reports

      # 7️⃣ Deploy to GitHub Pages (ONLY ONCE)
      - name: Deploy Cucumber HTML to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: reports/html
          force_orphan: true

      # 8️⃣ Print report URL
      - name: Print Report URL
        if: always()
        run: |
          echo "📊 Cucumber Report URL:"
          echo "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
